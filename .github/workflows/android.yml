name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unit tests
        run: gradle :app:testDebugUnitTest

      - name: Build release APK
        run: gradle :app:assembleRelease

      - name: Restore release signing key
        run: printf '%s' "${{ secrets.OMEGA_RELEASE_KEYSTORE_B64 }}" | base64 --decode > "$RUNNER_TEMP/omega-release.jks"

      - name: Sign and verify release APK
        env:
          OMEGA_STORE_PASSWORD: ${{ secrets.OMEGA_RELEASE_STORE_PASSWORD }}
          OMEGA_KEY_PASSWORD: ${{ secrets.OMEGA_RELEASE_KEY_PASSWORD }}
        run: |
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/OmegaReminder-1.1-aligned.apk"
          FINAL="app/build/outputs/apk/release/OmegaReminder-1.1.apk"

          "$ZIPALIGN" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$APKSIGNER" sign             --ks "$RUNNER_TEMP/omega-release.jks"             --ks-key-alias omega             --ks-pass env:OMEGA_STORE_PASSWORD             --key-pass env:OMEGA_KEY_PASSWORD             --out "$FINAL"             "$ALIGNED"

          "$APKSIGNER" verify --verbose --print-certs "$FINAL"
          rm -f "$RUNNER_TEMP/omega-release.jks" "$ALIGNED" "$FINAL.idsig"

      - uses: actions/upload-artifact@v4
        with:
          name: OmegaReminder-1.1-final
          path: app/build/outputs/apk/release/OmegaReminder-1.1.apk
          if-no-files-found: error
